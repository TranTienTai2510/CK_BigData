services:
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 768M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:9092"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - clickstream
    restart: unless-stopped

  redpanda-init:
    image: redpandadata/redpanda:v24.2.18
    depends_on:
      - redpanda
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until rpk cluster info -X brokers=redpanda:9092 >/dev/null 2>&1; do sleep 2; done
        for topic in events.raw events.clean order_events.raw agg.kpi pred.intent session.closed ops.metrics events.dlq; do
          if ! rpk topic list -X brokers=redpanda:9092 | awk 'NR > 1 {print $1}' | grep -Fxq "$$topic"; then
            rpk topic create "$$topic" --partitions 1 --replicas 1 -X brokers=redpanda:9092
          fi
        done
    mem_limit: 128m
    networks:
      - clickstream
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickstream
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - 'http://localhost:8123/ping'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - clickstream
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - clickhouse
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    mem_limit: 512m
    networks:
      - clickstream
    restart: unless-stopped

  spark-master:
    image: clickstream-spark:3.5.5
    depends_on:
      - redpanda
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_DAEMON_MEMORY: 512m
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      PYTHONPATH: /opt/project
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    volumes:
      - ./data/unified:/opt/project/data/unified:ro
      - ./models:/opt/project/models:ro
      - ./common:/opt/project/common:ro
      - ./ml:/opt/project/ml:ro
      - ./streaming:/opt/project/streaming:ro
      - spark-checkpoints:/opt/project/checkpoints
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    mem_limit: 1280m
    networks:
      - clickstream
    restart: unless-stopped

  spark-worker:
    image: clickstream-spark:3.5.5
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_CORES: 4
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      PYTHONPATH: /opt/project
    volumes:
      - ./data/unified:/opt/project/data/unified:ro
      - ./models:/opt/project/models:ro
      - ./common:/opt/project/common:ro
      - ./ml:/opt/project/ml:ro
      - ./streaming:/opt/project/streaming:ro
      - spark-checkpoints:/opt/project/checkpoints
    mem_limit: 4096m
    networks:
      - clickstream
    restart: unless-stopped

  q0-validate:
    image: clickstream-spark:3.5.5
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - "spark-submit --master spark://spark-master:7077 --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5 --conf spark.cores.max=1 --conf spark.executor.cores=1 --conf spark.executor.memory=768m --conf spark.ui.enabled=false /opt/project/streaming/q0_validate.py --bootstrap redpanda:9092 --starting latest"
    environment:
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      PYTHONPATH: /opt/project
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    volumes:
      - ./common:/opt/project/common:ro
      - ./streaming:/opt/project/streaming:ro
      - spark-checkpoints:/opt/project/checkpoints
    mem_limit: 1536m
    networks:
      - clickstream
    restart: unless-stopped

  q1-kpi:
    image: clickstream-spark:3.5.5
    depends_on:
      q0-validate:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - "spark-submit --master spark://spark-master:7077 --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5 --conf spark.cores.max=1 --conf spark.executor.cores=1 --conf spark.executor.memory=768m --conf spark.ui.enabled=false /opt/project/streaming/q1_kpi.py --bootstrap redpanda:9092 --starting latest"
    environment:
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      PYTHONPATH: /opt/project
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    volumes:
      - ./common:/opt/project/common:ro
      - ./streaming:/opt/project/streaming:ro
      - spark-checkpoints:/opt/project/checkpoints
    mem_limit: 1536m
    networks:
      - clickstream
    restart: unless-stopped

  q2-intent:
    image: clickstream-spark:3.5.5
    depends_on:
      q0-validate:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - "spark-submit --master spark://spark-master:7077 --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5 --conf spark.cores.max=1 --conf spark.executor.cores=1 --conf spark.executor.memory=768m --conf spark.ui.enabled=false /opt/project/streaming/q2_intent.py --bootstrap redpanda:9092 --starting latest --in-topic events.clean --pred-topic pred.intent --closed-topic session.closed"
    environment:
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      PYTHONPATH: /opt/project
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    volumes:
      - ./models:/opt/project/models:ro
      - ./common:/opt/project/common:ro
      - ./ml:/opt/project/ml:ro
      - ./streaming:/opt/project/streaming:ro
      - spark-checkpoints:/opt/project/checkpoints
    mem_limit: 1536m
    networks:
      - clickstream
    restart: unless-stopped

volumes:
  redpanda-data:
  clickhouse-data:
  grafana-data:
  spark-checkpoints:

networks:
  clickstream:
    driver: bridge
